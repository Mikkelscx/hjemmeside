                height: 100% !important;

                height: 118px !important;
                max-width: 118px !important;
                max-height: 118px !important;
                margin: 0 !important;
                transform: translateY(-50%) rotate(-2deg) !important;

            body.contact-sketchbook-page .contact-item__icon--phone {

            body.contact-sketchbook-page .contact-item__icon--linkedin {

            body.contact-sketchbook-page .contact-item__text {

                min-width: 0 !important;

                z-index: 1 !important;

                font-weight: 900 !important;
                color: #1a1a1a !important;
                -webkit-text-fill-color: #1a1a1a !important;

            body.contact-sketchbook-page .contact-item p {

                -webkit-text-fill-color: rgba(0, 0, 0, 0.78) !important;
                text-decoration: none !important;

            body.contact-sketchbook-page .contact-item p { font-size: 1.3rem !important; }
