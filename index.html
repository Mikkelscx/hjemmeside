    <style id="msk-open-projects-fix">
    @media (min-width: 1025px) and (hover: hover) and (pointer: fine) {
        body.home-notebook-page.home-shift-projects .home-notebook__title,
        body.home-notebook-page.home-opening-layout .home-notebook__title,
        body.home-notebook-page.home-opening-projects .home-notebook__title {
            position: absolute !important;
            inset: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transform: none !important;
            opacity: 1 !important;
            visibility: visible !important;
            animation: none !important;
        }
        body.home-notebook-page.home-shift-projects .home-notebook__title-img,
        body.home-notebook-page.home-opening-layout .home-notebook__title-img,
        body.home-notebook-page.home-opening-projects .home-notebook__title-img {
            opacity: 1 !important;
            visibility: visible !important;
            mix-blend-mode: normal !important;
            width: min(480px, calc(var(--bookW) * 0.82)) !important;
            max-width: 86% !important;
        }
        body.home-notebook-page.home-opening-projects.home-cover-open-half .home-notebook__cover-front,
        body.home-notebook-page.home-opening-projects.home-cover-open-half .home-notebook__title,
        body.home-notebook-page.home-opening-projects.home-cover-open-half .home-notebook__title-img {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
        body.home-notebook-page.home-opened-projects .home-notebook__cover,
        body.home-notebook-page.home-opened-projects .home-notebook__cover-front,
        body.home-notebook-page.home-opened-projects .home-notebook__title,
        body.home-notebook-page.home-opened-projects .home-notebook__volume,
        body.home-notebook-page.home-opened-projects .home-notebook__flat-left,
        body.home-notebook-page.home-opened-projects .home-notebook__projekter-left {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            animation: none !important;
            transform: none !important;
        }
        body.home-notebook-page.home-opened-projects .home-notebook__spread {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            transform: none !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 8 !important;
        }
        body.home-notebook-page.home-opened-projects .home-notebook__projekter-full {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            transform: none !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            z-index: 8 !important;
        }
    }
    </style>

    <!-- Frontpage: notebook cover -->
    <main class="home-notebook" role="main" aria-label="Forside">
        <div class="home-notebook__book-shadow" aria-hidden="true"></div>
        <div class="home-notebook__pages" aria-hidden="true"></div>
        <div class="home-notebook__volume" aria-hidden="true">
            <div class="home-notebook__page-block" aria-hidden="true"></div>
            <div class="home-notebook__page-stack" aria-hidden="true">
                <div class="home-notebook__page-leaf" style="--i:0" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:1" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:2" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:3" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:4" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:5" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:6" aria-hidden="true"></div>
                <div class="home-notebook__page-leaf" style="--i:7" aria-hidden="true"></div>
            </div>
            <div class="home-notebook__spine" aria-hidden="true"></div>
            <div class="home-notebook__fore-edge" aria-hidden="true"></div>
            <div class="home-notebook__head-edge" aria-hidden="true"></div>
            <div class="home-notebook__tail-edge" aria-hidden="true"></div>
        </div>
        <div class="home-notebook__cover" aria-hidden="true">
            <div class="home-notebook__cover-front" aria-hidden="true">
                <div class="home-notebook__spine-band" aria-hidden="true"></div>
                <h1 class="home-notebook__title home-notebook__title--image" data-text="Mikkels notesbog">
                    <span class="home-notebook__title-text">Mikkels notesbog</span>
                    <img class="home-notebook__title-img" src="assets/Mikkels%20notesbog%20.webp" alt="" width="1536" height="1024" decoding="async">
                </h1>
            </div>
            <div class="home-notebook__cover-back" aria-hidden="true">
                <div class="home-notebook__cover-back-clip" aria-hidden="true"></div>
            </div>
        </div>
        <div class="home-notebook__leaf-fan" aria-hidden="true"></div>
        <!-- Hidden "inside pages" shown during open animation -->
        <div class="home-notebook__spread" aria-hidden="true">
            <!-- Single full Projects preview (easier to make seamless) -->
            <iframe
                class="home-notebook__projekter-full"
                src="projects.html"
                title="Projekter preview"
                loading="eager"
                referrerpolicy="no-referrer"
                tabindex="-1"
            ></iframe>
        </div>
    </main>
