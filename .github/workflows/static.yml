# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel older queued runs so latest wins
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare slim publish tree
        run: |
          set -e
          mkdir -p publish
          # Hele sitet, men uden historiske cache-bust kopier / tunge logs (Pages artifact-limit)
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'publish' \
            --exclude 'hjemmesiden' \
            --exclude 'auto-commit.log' \
            --exclude '_debug' \
            --exclude 'script-20260924p*.js' \
            --exclude 'styles-20260924p*.css' \
            ./ publish/
          # Behold kun de seneste cache-bust assets (nuværende + lidt historik)
          for n in 435 436 437 438 439 440; do
            [ -f "script-20260924p${n}.js" ] && cp "script-20260924p${n}.js" publish/
            [ -f "styles-20260924p${n}.css" ] && cp "styles-20260924p${n}.css" publish/
          done
          # Altid kanoniske filer
          cp -f script.js styles.css publish/
          touch publish/.nojekyll
          # Kun min-hjemmeside ejer www.mikkelsc.dk — undgå dual-CNAME deploy-fail
          if [ "${GITHUB_REPOSITORY:-}" = "Mikkelscx/hjemmeside" ]; then
            rm -f publish/CNAME
          else
            printf 'www.mikkelsc.dk\n' > publish/CNAME
          fi
          du -sh publish
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'publish'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
