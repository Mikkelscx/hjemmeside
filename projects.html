    <script>
    (function () {
      try {
        var iw = window.innerWidth || 1;
        var ih = window.innerHeight || 1;
        var max = Math.max(iw, ih);
        var min = Math.min(iw, ih);
        var inTabletBand = max >= 1024 && max <= 1366 && min >= 600;
        var inPhoneBand = max <= 1024 && min <= 640;
        var landscape =
          window.matchMedia &&
          (window.matchMedia('(orientation: landscape)').matches ||
            window.matchMedia('(min-aspect-ratio: 1/1)').matches);
        var portrait =
          window.matchMedia &&
          (window.matchMedia('(orientation: portrait)').matches ||
            window.matchMedia('(max-aspect-ratio: 1/1)').matches);
        document.documentElement.classList.remove(
          'msk-projects-ipad-landscape',
          'msk-projects-ipad-landscape-no-scroll',
          'msk-projects-ipad-portrait',
          'msk-projects-phone-portrait',
          'msk-projects-phone-landscape'
        );
        if (inPhoneBand && (portrait || ih > iw + 16)) {
          document.documentElement.classList.add(
            'msk-projects-phone-portrait',
            'msk-projects-phone-portrait-no-scroll',
            'msk-projects-mindmap-painted',
            'phone-portrait-zoom-stable'
          );
          try {
            if (typeof mskBootPhonePortraitProfileVars === 'function') {
              mskBootPhonePortraitProfileVars(iw, ih);
            }
          } catch (e2) {}
          document.addEventListener('DOMContentLoaded', function () {
            try {
              var c = document.querySelector('.brainstorm-container');
              if (c) {
                c.classList.add('projects-mindmap--portrait');
              }
            } catch (e) {}
          });
        } else if (
          inPhoneBand &&
          min <= 520 &&
          (landscape || iw > ih + 16)
        ) {
          document.documentElement.classList.add('msk-projects-phone-landscape');
        } else if (inTabletBand && (portrait || ih > iw + 16)) {
          document.documentElement.classList.add(
            'msk-projects-ipad-portrait',
            'msk-projects-mindmap-painted'
          );
          document.addEventListener('DOMContentLoaded', function () {
            try {
              var c = document.querySelector('.brainstorm-container');
              if (c) {
                c.classList.add('projects-mindmap--portrait');
              }
            } catch (e) {}
          });
        } else if (landscape && inTabletBand) {
          document.documentElement.classList.add(
            'msk-projects-ipad-landscape',
            'msk-projects-ipad-landscape-no-scroll',
            'msk-mindmap-booting'
          );
        }
      } catch (e) {}
    })();
    </script>

    <script src="script.js?v=projects-mindmap-guaranteed-20260525-zoom-p90"></script>
    <script>
    (function mskProjectsPhonePortraitMindmapFailsafe() {
      function isTabletLandscapeViewportLive() {
        try {
          var iw = window.innerWidth || 1;
          var ih = window.innerHeight || 1;
          var max = Math.max(iw, ih);
          var min = Math.min(iw, ih);
          return max >= 1024 && max <= 1366 && min >= 600 && iw > ih + 16;
        } catch (e) {
          return false;
        }
      }
      function isPortraitTouchProjects() {
        try {
          if (isTabletLandscapeViewportLive()) return false;
          var html = document.documentElement;
          if (
            html.classList.contains('msk-projects-phone-portrait') ||
            html.classList.contains('msk-projects-ipad-portrait')
          ) {
            return true;
          }
          var iw = window.innerWidth || 1;
          var ih = window.innerHeight || 1;
          return iw <= 1024 && ih > iw + 8;
        } catch (e) {
          return false;
        }
      }
      function isIpadLandscapeProjects() {
        try {
          if (isTabletLandscapeViewportLive()) return true;
          var html = document.documentElement;
          return (
            html.classList.contains('msk-projects-ipad-landscape') ||
            html.classList.contains('msk-projects-ipad-landscape-no-scroll')
          );
        } catch (e) {
          return false;
        }
      }
      function revealAndRelayout() {
        try {
          if (!document.body || !document.body.classList.contains('projects-page')) return;
          var portrait = isPortraitTouchProjects();
          var ipadLs = isIpadLandscapeProjects();
          if (!portrait && !ipadLs) return;
          document.documentElement.classList.remove('msk-mindmap-booting');
          document.documentElement.classList.add('msk-projects-mindmap-painted');
          if (portrait && document.documentElement.classList.contains('msk-projects-phone-portrait')) {
            document.documentElement.classList.add('msk-projects-phone-portrait-no-scroll');
          }
          if (ipadLs) {
            document.documentElement.classList.remove('msk-projects-ipad-portrait');
          }
          var c = document.querySelector('.brainstorm-container');
          if (c) {
            if (portrait && !ipadLs) c.classList.add('projects-mindmap--portrait');
            else if (ipadLs) c.classList.remove('projects-mindmap--portrait');
            c.dataset.mskRevealed = '1';
          }
          if (typeof window.mskProjectsMindmapRelayoutAfterTabletOrientation === 'function') {
            window.mskProjectsMindmapRelayoutAfterTabletOrientation(true);
            return;
          }
          if (typeof window.__mskProjectsMindmapInitFn === 'function') {
            window.__mskProjectsMindmapInitFn();
          }
          if (typeof window.__mskProjectsRelayout === 'function') {
            window.__mskProjectsRelayout(true);
          }
          try {
            window.scrollTo(0, 0);
          } catch (e) {}
        } catch (e) {}
      }
      function schedule() {
        revealAndRelayout();
        window.setTimeout(revealAndRelayout, 320);
        window.setTimeout(revealAndRelayout, 640);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', schedule);
      } else {
        schedule();
      }
      window.addEventListener('load', function () {
        window.setTimeout(revealAndRelayout, 80);
      });
      window.addEventListener('orientationchange', function () {
        window.setTimeout(revealAndRelayout, 160);
      });
    })();
    </script>
